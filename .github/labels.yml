# Custom label set for repos generated from this template.
# Synced to the repo by .github/workflows/labels.yml on every push to main.

- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: duplicate
  color: cfd3d7
  description: This issue or PR already exists
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: invalid
  color: e4e669
  description: This doesn't seem right

- name: priority:high
  color: d93f0b
  description: Needs attention soon
- name: priority:medium
  color: fbca04
  description: Normal priority
- name: priority:low
  color: 5fc158
  description: Nice to have

# All subject:* labels share the same color.
- name: "subject: general"
  color: c5def5
  description: General topic, not tied to a specific area
