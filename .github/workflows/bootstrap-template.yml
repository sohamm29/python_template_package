name: Bootstrap Template

# Runs once in repositories generated from this template (not in the template
# itself). It seeds the label set and opens a "good first issue", then removes
# itself so it never runs again.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    # Skip when running inside the template repository itself.
    if: github.event.repository.is_template == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: true

      - name: Open the good first issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Get started: configure this project" \
            --label "good first issue" \
            --body-file .github/GOOD_FIRST_ISSUE.md

      - name: Remove bootstrap workflow so it runs only once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-template.yml .github/GOOD_FIRST_ISSUE.md
          git commit -m "chore: remove one-time template bootstrap"
          git push
